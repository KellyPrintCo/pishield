<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1116">
<title>PiShield</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z' fill='%2334d399'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z" fill="var(--accent)"/><path d="m11 16 3.5 3.5L21.5 12" stroke="var(--bg)" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>PiShield</span>
  </div>
  <div id="pill" class="pill"></div>
  <button id="logout" class="ghost small hidden" title="Sign out">Sign out</button>
</header>
<nav id="tabs" class="tabs hidden"></nav>
<main id="view"></main>

<div id="login" class="login hidden">
  <form id="loginForm" class="card login-card">
    <svg viewBox="0 0 32 32" width="44" height="44" aria-hidden="true"><path d="M16 2 4 7v8c0 7.5 5.1 13.4 12 15 6.9-1.6 12-7.5 12-15V7z" fill="var(--accent)"/></svg>
    <h2>PiShield</h2>
    <p class="muted">Sign in to manage ad blocking</p>
    <input id="pw" type="password" placeholder="Dashboard password" autocomplete="current-password" required>
    <button type="submit" class="primary">Sign in</button>
    <p id="loginErr" class="error-text"></p>
  </form>
</div>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <div id="dlgBody"></div>
    <div class="row end">
      <button value="cancel" class="ghost" formnovalidate>Cancel</button>
      <button value="ok" class="primary" id="dlgOk">OK</button>
    </div>
  </form>
</dialog>
<div id="toasts"></div>
<script src="/static/app.js"></script>
</body>
</html>
